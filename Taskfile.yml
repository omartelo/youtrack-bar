version: "3"

vars:
  BIN: bin/youtrack-tui
  # The tag this working tree sits exactly on, or "dev". Deliberately not
  # `git describe`: its v0.2.0-1-gabc form is a pre-release by semver rules, so
  # a build one commit *ahead* of a tag would be offered that tag as an update.
  VERSION:
    sh: git describe --tags --exact-match 2>/dev/null || echo dev

tasks:
  default:
    desc: List available tasks
    cmds: [task --list]
    silent: true

  build:
    desc: Build the binary into bin/
    sources: ["**/*.go", go.mod, go.sum]
    generates: ["{{.BIN}}"]
    cmds:
      # Stamped the same way GoReleaser does, so a local build reports the tag
      # it was built from rather than "dev".
      - go build -ldflags "-X github.com/omartelo/youtrack-tui/internal/update.Version={{.VERSION}}" -o {{.BIN}} .

  run:
    desc: "Run the TUI — task run -- -provider acme"
    deps: [build]
    # interactive is mandatory here: without it task buffers stdio and the TUI
    # gets no raw terminal.
    interactive: true
    silent: true
    cmds:
      - "{{.BIN}} {{.CLI_ARGS}}"

  test:
    desc: Run tests with the race detector
    cmds:
      - go test -race ./...

  test:install:
    desc: Smoke-test the curl installer
    cmds:
      - sh scripts/test-install.sh

  cover:
    desc: Test coverage summary
    cmds:
      - go test -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out | tail -1

  lint:
    desc: gofmt check, go vet, golangci-lint
    preconditions:
      - sh: command -v golangci-lint
        msg: golangci-lint is not installed — https://golangci-lint.run/welcome/install/
    cmds:
      - test -z "$(gofmt -l .)" || { echo "not gofmt'd:"; gofmt -l .; exit 1; }
      - go vet ./...
      - golangci-lint run

  fmt:
    desc: Format every Go file in place
    cmds:
      - gofmt -w .

  tidy:
    desc: Prune and sync go.mod / go.sum
    cmds:
      - go mod tidy

  check:
    desc: What CI runs locally
    cmds:
      - task: lint
      - task: test
      - task: test:install

  install:
    desc: Install youtrack-tui into GOBIN
    cmds:
      - go install .

  clean:
    desc: Remove build and coverage artifacts
    cmds:
      - rm -rf bin coverage.out
