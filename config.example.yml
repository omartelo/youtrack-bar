# youtrack-tui — copy to $XDG_CONFIG_HOME/youtrack-tui/config.yml
#
# Never write the token in plain text here. Use ${VAR}: the value is expanded
# from the environment when the file is loaded.

page_size: 50 # issues fetched per request; `m` loads the next page

# How often watched filters are polled for new issues. Minimum 30s.
watch_interval: 2m
# Command used to put a notification on screen: zenity (default), notify-send,
# or none to stay quiet.
notifier: zenity

# Open an issue with its newest comment on top instead of the oldest, which is
# the order YouTrack returns them in. `S` on an open issue flips it and writes
# this line back, so setting it here is only for the first run.
comments_newest_first: false

# The TUI asks GitHub for a newer release once at startup and reports it in the
# header; `youtrack-tui update` is what installs one. Set to false to stay off
# the network entirely.
check_updates: true

providers:
  - name: acme
    url: https://acme.youtrack.cloud
    token: ${YOUTRACK_TOKEN_ACME} # perm:xxxx.yyyy.zzzz
    # Custom fields shown on the issue list summary line. These are the field
    # names of YOUR instance. Omit to get the first three non-empty fields.
    list_fields: [State, Priority, Assignee]
    # Saved-search IDs pinned to the top of the filters screen, in this order.
    # Written by pressing `f` in the app rather than by hand — YouTrack's API
    # has no favourite flag on a saved search, so this list is ours. IDs rather
    # than names so a rename in YouTrack does not lose the pin; the built-in
    # filters use a `builtin:` prefix.
    favorites:
      - builtin:my-open-issues
      - 145-3
    # Saved-search IDs to poll in the background. An issue that appears in one
    # of these raises a desktop notification and is marked in the list until
    # you open it. Written by `w` in the app, like `favorites` is by `f`, so
    # what you were watching is what the next run polls.
    watch:
      - 145-3

  - name: internal
    url: https://youtrack.corp.local
    token: ${YOUTRACK_TOKEN_INTERNAL}
    # Certificate does not verify against the system roots? Point at the PEM
    # bundle that does trust it. If you already export one for other tools,
    # reference it instead of copying the path:
    #   ca_file: ${NODE_EXTRA_CA_CERTS}
    ca_file: /etc/ssl/certs/corp-ca.pem
    # Last resort, and only if ca_file is not an option. It disables
    # certificate verification for THIS provider, which means anyone able to
    # intercept the connection gets the token. Mutually exclusive with
    # ca_file; the header shows !insecure while it is on.
    # insecure_skip_verify: true
