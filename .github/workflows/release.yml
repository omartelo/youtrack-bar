name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # One job: GoReleaser builds the archives, publishes the GitHub Release, then
  # renders and pushes the Homebrew formula and the AUR PKGBUILD from the assets
  # it just uploaded.
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # GoReleaser needs the tag history to resolve the version.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # A last gate before anything is published. The full three-OS matrix
      # already ran on main; this is the cheap re-check that the tagged tree is
      # the tree that passed.
      - run: go test -race ./...
      - run: sh scripts/test-install.sh

      # The notes are the CHANGELOG entry for this tag. A missing entry fails
      # the release rather than shipping empty notes — writing it is part of
      # cutting a version.
      - name: Compose release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="${RUNNER_TEMP}/release-notes.md"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { grab = 1; next }
            grab && (/^## \[/ || /^\[[^]]+\]:/) { exit }
            grab { print }
          ' CHANGELOG.md > "$notes"
          if [ ! -s "$notes" ]; then
            echo "missing CHANGELOG.md entry for ${version}" >&2
            exit 1
          fi

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes ${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Deploy key on omartelo/homebrew-tap. Unlike a PAT it reaches exactly
          # that one repository and never expires.
          HOMEBREW_TAP_SSH_KEY: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}
          # SSH key registered on the AUR account that owns youtrack-tui-bin.
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

      # Composing the notes is not publishing them: GoReleaser reads
      # --release-notes inside the changelog pipe, so a config that skips that
      # pipe publishes an empty release and says nothing. Two versions went out
      # that way before anyone looked. Fail here instead.
      - name: Verify the release carries its notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body=$(gh release view "$GITHUB_REF_NAME" --json body --jq .body | tr -d '[:space:]')
          if [ -z "$body" ]; then
            echo "${GITHUB_REF_NAME} was published with empty release notes" >&2
            exit 1
          fi
